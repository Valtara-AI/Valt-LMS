# Advanced DDoS Protection Nginx Configuration for LMS
# Rate limiting zones - ENHANCED
limit_req_zone $binary_remote_addr zone=general:20m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:20m rate=5r/s;
limit_req_zone $binary_remote_addr zone=login:20m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:20m;
limit_conn_zone $server_name zone=server_conn:20m;

# GeoIP blocking (optional - uncomment if geoip module installed)
# geo $blocked_country {
#     default 0;
#     # Add countries to block here
# }

# Block bad bots and scanners
map $http_user_agent $bad_bot {
    default 0;
    ~*malicious 1;
    ~*scraper 1;
    ~*scanner 1;
    ~*nikto 1;
    ~*sqlmap 1;
    ~*nmap 1;
    ~*masscan 1;
    ~*acunetix 1;
    ~*nessus 1;
    ~*python-requests 1;
    ~*python-urllib 1;
    ~*libwww-perl 1;
    ~*wget 1;
    ~*harvest 1;
    ~*extract 1;
    ~*grab 1;
    ~*miner 1;
}

# Block suspicious request methods
map $request_method $bad_method {
    default 0;
    ~*TRACE 1;
    ~*TRACK 1;
    ~*OPTIONS 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name lms.valtara.ai 188.245.43.183;

    # Redirect HTTP to HTTPS
    if ($host = lms.valtara.ai) {
        return 301 https://$host$request_uri;
    }
    return 404;
}

server {
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    server_name lms.valtara.ai 188.245.43.183;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/lms.valtara.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.valtara.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hide nginx version
    server_tokens off;

    # Block bad bots immediately
    if ($bad_bot) {
        return 444;
    }

    # Block bad methods
    if ($bad_method) {
        return 444;
    }

    # Block requests with no User-Agent
    if ($http_user_agent = "") {
        return 444;
    }

    # Global connection limits
    limit_conn conn_limit 20;
    limit_conn server_conn 1000;

    # Request size limits - prevent large payload attacks
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts - prevent slowloris attacks
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;
    reset_timedout_connection on;

    # Buffer overflow protection
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Logging for fail2ban
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log;

    location / {
        # Rate limiting
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # API rate limiting (stricter)
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login/Auth endpoints - very strict rate limiting
    location ~ ^/(api/auth|login|signin|signup) {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block common attack paths
    location ~* /(\.git|\.env|\.htaccess|wp-admin|wp-login|phpmyadmin|admin\.php|xmlrpc\.php|wp-includes|wp-content|cgi-bin) {
        return 444;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block access to backup files
    location ~* \.(bak|backup|old|orig|save|sql|tar|gz|zip)$ {
        deny all;
        return 404;
    }

    # Health check endpoint (no rate limiting)
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
