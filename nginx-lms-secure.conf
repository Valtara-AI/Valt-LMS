# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Block bad bots and scanners
map $http_user_agent $bad_bot {
    default 0;
    ~*malicious 1;
    ~*bot 0;
    ~*crawler 0;
    ~*spider 0;
    ~*scraper 1;
    ~*scanner 1;
    ~*nikto 1;
    ~*sqlmap 1;
    ~*nmap 1;
    ~*masscan 1;
    ~*curl 0;
    ~*wget 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name lms.valtara.ai 188.245.43.183;

    # Redirect HTTP to HTTPS
    if ($host = lms.valtara.ai) {
        return 301 https://$host$request_uri;
    }
    return 404;
}

server {
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    server_name lms.valtara.ai 188.245.43.183;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/lms.valtara.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.valtara.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Block bad bots
    if ($bad_bot) {
        return 403;
    }

    # Block requests with no User-Agent (often scanners)
    if ($http_user_agent = "") {
        return 444;
    }

    # Connection limits
    limit_conn conn_limit 20;

    # Request size limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts to prevent slowloris attacks
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 10s;

    # Hide nginx version
    server_tokens off;

    location / {
        # Rate limiting
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # API rate limiting (stricter)
    location /api/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block common attack paths
    location ~* /(\.git|\.env|\.htaccess|wp-admin|wp-login|phpmyadmin|admin\.php) {
        return 444;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
